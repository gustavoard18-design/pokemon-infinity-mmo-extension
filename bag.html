<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochila</title>
    <link rel="stylesheet" href="pixel-theme.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 9px 10px 14px; background: var(--px-bg); color: var(--px-text); font-family: var(--px-font-body); font-size: 12px; }
        .bg-head { font-family: var(--px-font-mono); font-size: 12px; font-weight: 800; color: var(--px-accent); letter-spacing: .5px; margin-bottom: 6px; }
        .bg-search { width: 100%; font-family: var(--px-font-body); font-size: 12px; padding: 5px 8px; margin-bottom: 8px; background: var(--px-bg-btn, #fff); color: var(--px-text-val, #2b2820); border: 2px solid var(--px-border-btn, #1a1a1a); border-radius: 6px; }
        .bg-sum { font-family: var(--px-font-mono); font-size: 10px; color: var(--px-text-dim); margin-bottom: 8px; }
        .bg-pocket { margin-bottom: 10px; }
        .bg-pocket-head { font-family: var(--px-font-mono); font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--px-text-hi); background: var(--px-bg-bar, #f2efe4); border: 2px solid var(--px-border-panel, #1a1a1a); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .bg-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 6px; border-bottom: 1px solid var(--px-line, #f0ead8); }
        .bg-item:last-child { border-bottom: none; }
        .bg-img { width: 26px; height: 26px; flex: 0 0 auto; image-rendering: pixelated; object-fit: contain; margin-top: 1px; }
        .bg-info { flex: 1; min-width: 0; }
        .bg-nm { font-family: var(--px-font-mono); font-size: 12px; font-weight: 700; color: var(--px-text-hi); }
        .bg-qty { font-family: var(--px-font-mono); font-size: 11px; font-weight: 800; color: var(--px-accent, #e3350d); flex: 0 0 auto; }
        .bg-desc { font-size: 10px; color: var(--px-text-dim); line-height: 1.35; margin-top: 1px; }
        .bg-desc.en { font-style: italic; }
        .bg-en { font-size: 8px; color: var(--px-text-dim); border: 1px solid var(--px-line, #ccc); border-radius: 6px; padding: 0 3px; margin-left: 4px; }
        .bg-wait { color: var(--px-text-dim); text-align: center; padding: 24px 10px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="bg-head">🎒 MOCHILA</div>
    <input type="text" class="bg-search" id="bg-search" placeholder="🔎 buscar item…">
    <div class="bg-sum" id="bg-sum"></div>
    <div id="bg-body"><div class="bg-wait">Aguardando seus itens…<br>Abra o jogo (fique logado); a mochila sincroniza sozinha.</div></div>

    <script src="components/panel-interaction-forwarder.js"></script>
    <script src="bag.js"></script>
</body>
</html>
