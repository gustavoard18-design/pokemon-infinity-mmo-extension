<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meus Pokémon</title>

    <link
        rel="stylesheet"
        href="pixel-theme.css"
    >

    <link rel="stylesheet" href="components/type-tag.css">
    <link rel="stylesheet" href="components/nature-effect.css">
    <link rel="stylesheet" href="components/pokemon-filters.css">
    <link rel="stylesheet" href="components/pokemon-card.css">
    <link rel="stylesheet" href="components/update-notice.css">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 9px 10px 14px; background: var(--px-bg); color: var(--px-text); font-family: var(--px-font-body); font-size: 12px; }
        .page-container { width: 100%; }
        .pokemon-toolbar { display: grid; gap: 8px; margin-bottom: 8px; }
        .pokemon-toolbar-main { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 4px; }
        /* linha com os dois botões de expandir tudo (grupos + fita não faz
           parte do CSS base do brief — precisa de um wrapper pra ficarem
           lado a lado, já que .pokemon-toolbar só empilha filhos diretos) */
        .pokemon-toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .px-btn[aria-pressed="true"] { background: var(--px-accent); border-color: var(--px-accent); color: var(--px-on-dark); }

        .pokemon-group-toggle { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
        .group-title { font-family: var(--px-font-mono); font-size: 10px; color: var(--px-accent); letter-spacing: 1.5px; text-transform: uppercase; }
        .group-rule { flex: 1; height: 1px; background: var(--px-line); }
        .group-counter { font-family: var(--px-font-mono); font-size: 10px; color: var(--px-text-dim); }
        .pokemon-group { margin-bottom: 8px; }

        /* habilidade injeta o ⓘ padrão (components/tooltip.js) —
           sem isso o ícone fica cortado pelo ellipsis da linha */
        /* regras .iv-rating[data-rating] moradas em pixel-theme.css — battle.js
           também renderiza PokemonIvEvaluation.html(foe) e precisa delas. */
        .moves-head { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
        .moves-head::after { content: ''; flex: 1; height: 1px; background: var(--px-line); }
        .pokemon-move { display: flex; align-items: center; gap: 7px; background: var(--px-bg-btn2); padding: 4px 6px; }
        .pokemon-move-type { width: 24px; height: 24px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
        .pokemon-move-name { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pokemon-move-category { font-family: var(--px-font-mono); font-size: 9px; }
        .pokemon-move-pp { font-family: var(--px-font-mono); font-size: 9px; color: var(--px-text-dim); width: 44px; text-align: right; }
        .transfer-status { margin: 0; font-family: var(--px-font-mono); font-size: 9px; line-height: 1.4; color: var(--px-text-dim); }
        .transfer-status[data-kind="ok"] { color: var(--px-good); }
        .transfer-status[data-kind="erro"] { color: var(--px-bad); }
        .imported-banner { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; padding: 5px 7px; border: 1px solid var(--px-accent); background: var(--px-bg-btn2); }
        .imported-banner-label { font-family: var(--px-font-mono); font-size: 9px; letter-spacing: 1.5px; color: var(--px-accent); }
        .imported-banner-file { flex: 1; min-width: 0; font-size: 11px; color: var(--px-text-val); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty { margin: 0; padding: 16px; border: 1px dashed var(--px-border); text-align: center; color: var(--px-text-dim); }
        [hidden] { display: none !important; }
        body.full .pokemon-list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    </style>
</head>

<body>
    <main class="page-container">
        <div class="pokemon-toolbar">
            <div class="pokemon-toolbar-main">
                <input type="search" class="px-input pokemon-filter" id="pokemon-name-filter" placeholder="Filtrar por nome…" aria-label="Filtrar Pokémon por nome">
                <button type="button" class="px-btn pokemon-advanced-toggle" id="toggle-advanced-filters" aria-pressed="false" data-tip="Filtros avançados: tipo, nível, IVs, natureza, item, gênero.">▤</button>
            </div>
            <div class="pokemon-toolbar-actions">
                <button type="button" class="px-btn" id="expand-all-groups" aria-pressed="false" data-tip="Expande ou recolhe todos os grupos (Meu Time e Caixas) de uma vez.">GRUPOS ABERTOS</button>
                <button type="button" class="px-btn" id="expand-all-pokemon" aria-pressed="false" data-tip="Abre os detalhes de todos os Pokémon de uma vez. Cada grupo abre e fecha pelo próprio título.">DETALHES DE TODOS</button>
                <button type="button" class="px-btn" id="toggle-moves" aria-pressed="true" data-tip="Mostra ou esconde a lista de golpes em todos os cartões.">GOLPES</button>
                <button type="button" class="px-btn" id="export-pokemon" data-tip="Baixa um JSON com o time e todas as caixas, ignorando os filtros.">EXPORTAR</button>
                <button type="button" class="px-btn" id="import-pokemon" data-tip="Abre um JSON exportado por outra pessoa. A lista fica só nesta sessão.">IMPORTAR</button>
                <input type="file" id="import-file" accept="application/json,.json" hidden>
            </div>
            <p class="transfer-status" id="transfer-status" role="status" hidden></p>
            <div class="pokemon-advanced-filters" id="pokemon-advanced-filters" hidden></div>
        </div>

        <div class="imported-banner" id="imported-banner" hidden>
            <span class="imported-banner-label">LISTA IMPORTADA</span>
            <span class="imported-banner-file" id="imported-banner-file"></span>
            <button type="button" class="px-btn" id="exit-imported">VOLTAR AOS MEUS</button>
        </div>

        <div id="content">
            <p class="empty">
                Aguardando os dados dos Pokémon...
            </p>
        </div>
    </main>

    <script src="data/extension-storage.js"></script>
    <script src="components/tooltip.js"></script>
    <script src="components/update-notice.js"></script>
    <script src="components/pixel-icon.js"></script>
    <script src="components/type-tag.js"></script>
    <script src="components/nature-effect.js"></script>
    <script src="components/ability-info.js"></script>
    <script src="components/iv-evaluation.js"></script>
    <script src="components/pokemon-card.js"></script>
    <script src="components/pokemon-transfer.js"></script>
    <script src="components/pokemon-filters.js"></script>
    <script src="data/constants.js"></script>
    <script src="components/shortcut-forwarder.js"></script>
    <script src="myPokemons.js"></script>
</body>
</html>
